name: Lumora Release

on:
  push:
    tags:
      - 'release/*'

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use release/x.y.z format."
            exit 1
          fi

          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tag ${TAG_NAME} must point to a commit on main."
            exit 1
          fi

          VERSION="${TAG_NAME#release/}"
          APP_VERSION="$(
            awk -F' = |;' '/MARKETING_VERSION = / { print $2 }' Lumora.xcodeproj/project.pbxproj |
              sed '/^$/d' |
              sort -u
          )"
          APP_VERSION_COUNT="$(printf '%s\n' "${APP_VERSION}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "${APP_VERSION_COUNT}" != "1" ]]; then
            echo "::error::Expected exactly one MARKETING_VERSION in Lumora.xcodeproj/project.pbxproj, found ${APP_VERSION_COUNT}: ${APP_VERSION}"
            exit 1
          fi

          if [[ "${APP_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag version ${VERSION} does not match app MARKETING_VERSION ${APP_VERSION}."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"

      - name: Extract release notes
        run: |
          set -euo pipefail

          awk -v version="${VERSION}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { lines[++count] = $0 }
            END {
              start = 1
              while (start <= count && lines[start] == "") {
                start++
              }
              end = count
              while (end >= start && lines[end] == "") {
                end--
              }
              for (i = start; i <= end; i++) {
                print lines[i]
              }
            }
          ' LUMORA_RELEASE_NOTES.md > release-notes-body.md

          if [[ ! -s release-notes-body.md ]]; then
            echo "::error::No release notes found for ${VERSION} in LUMORA_RELEASE_NOTES.md."
            exit 1
          fi

      - name: Check resource references
        run: python3 scripts/check-branding.py

      - name: Build and ad-hoc sign
        run: |
          set -euo pipefail

          xcodebuild -project Lumora.xcodeproj -scheme Lumora -configuration Release \
            MACOSX_DEPLOYMENT_TARGET=15.6 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            -derivedDataPath build \
            build

          APP_PATH="build/Build/Products/Release/Lumora.app"
          test -d "${APP_PATH}"
          codesign --verify --deep --strict "${APP_PATH}"

      - name: Package installable DMG
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release/Lumora.app"
          STAGING_PATH="${GITHUB_WORKSPACE}/dmg-staging"
          DMG_PATH="${GITHUB_WORKSPACE}/Lumora-${VERSION}.dmg"
          CHECKSUM_PATH="${DMG_PATH}.sha256"

          mkdir -p "${STAGING_PATH}"
          ditto "${APP_PATH}" "${STAGING_PATH}/Lumora.app"
          ln -s /Applications "${STAGING_PATH}/Applications"
          hdiutil create -volname "Lumora" \
            -srcfolder "${STAGING_PATH}" \
            -ov -format UDZO \
            "${DMG_PATH}"

          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 "Lumora-${VERSION}.dmg" > "Lumora-${VERSION}.dmg.sha256"
          test -s "${CHECKSUM_PATH}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "${TAG_NAME}" \
            "${GITHUB_WORKSPACE}/Lumora-${VERSION}.dmg" \
            "${GITHUB_WORKSPACE}/Lumora-${VERSION}.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lumora ${VERSION}" \
            --notes-file release-notes-body.md \
            --verify-tag \
            --target "${GITHUB_SHA}"
